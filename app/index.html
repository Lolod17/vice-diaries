<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Diaries</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="studio">
  <aside id="rail-left">
    <header class="brand">
      <p class="eyebrow">Issue 01</p>
      <h1>Vice Diaries</h1>
    </header>
    <section class="block">
      <h2>Photos</h2>
      <label class="drop">
        <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        <span class="drop-title">Add a photo</span>
        <span class="drop-note">Click, drop onto the stage, or paste</span>
      </label>
      <div id="photo-strip"></div>
    </section>
    <section class="block">
      <h2>Composition</h2>
      <div id="layout-list">
        <button type="button" data-layout="vice-classic" aria-pressed="true">Vice Classic</button>
        <button type="button" data-layout="sunset-stories">Sunset Stories</button>
        <button type="button" data-layout="neon-nights">Neon Nights</button>
        <button type="button" data-layout="miami-lifestyle">Miami Lifestyle</button>
        <button type="button" data-layout="crime-drama">Crime Drama</button>
        <button type="button" data-layout="cinematic-split">Cinematic Split</button>
        <button type="button" data-layout="vertical-editorial">Vertical Editorial</button>
        <button type="button" data-layout="multi-collage">Multi-Character</button>
      </div>
    </section>
    <section class="block">
      <h2>Format</h2>
      <div id="size-row">
        <button type="button" data-size="1080x1080">1080×1080</button>
        <button type="button" data-size="1080x1350" aria-pressed="true">1080×1350</button>
        <button type="button" data-size="1920x1080">1920×1080</button>
      </div>
    </section>
  </aside>
  <main id="stage">
    <div class="pool">
      <canvas id="preview" width="1080" height="1350" aria-label="Cover preview"></canvas>
    </div>
    <div class="stage-bar">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="compare" type="button">Compare</button>
    </div>
    <p id="hint">1. Sample is on the poster. 2. Swap in your photo. 3. Export the PNG.</p>
  </main>
  <aside id="rail-right">
    <section id="section-lettering" class="block" open>
      <h2>Lettering</h2>
      <label>Title <input id="field-title" type="text" maxlength="32" value="VICE DIARIES"></label>
      <label>Subtitle <input id="field-subtitle" type="text" maxlength="48" value="a night on the boulevard"></label>
      <label>Tagline <input id="field-tagline" type="text" maxlength="42" value="coming soon"></label>
      <div class="pair">
        <label>Issue <input id="field-issue" type="text" maxlength="8" value="01"></label>
        <label>Rating <input id="field-rating" type="text" maxlength="1" value="M"></label>
      </div>
      <label>Title scale <input id="title-scale" type="range" min="0.7" max="1.4" step="0.01" value="1"></label>
      <label>Rotation <input id="title-rotate" type="range" min="-6" max="6" step="0.1" value="0"></label>
      <div class="pair" id="align-row">
        <label>Title align
          <select id="title-align">
            <option value="left">Left</option>
            <option value="center" selected>Centre</option>
            <option value="right">Right</option>
          </select>
        </label>
        <label>Captions
          <select id="caption-align">
            <option value="left" selected>Left</option>
            <option value="center">Centre</option>
            <option value="right">Right</option>
          </select>
        </label>
      </div>
    </section>
    <section id="section-grade" class="block">
      <h2>Grade</h2>
      <div class="chips" id="grade-list">
        <button type="button" data-grade="vice-sunset" aria-pressed="true">Vice Sunset</button>
        <button type="button" data-grade="miami-heat">Miami Heat</button>
        <button type="button" data-grade="neon-purple">Neon Purple</button>
        <button type="button" data-grade="tropical-gold">Tropical Gold</button>
        <button type="button" data-grade="midnight-vice">Midnight Vice</button>
        <button type="button" data-grade="retro-film">Retro Film</button>
        <button type="button" data-grade="warm-cinema">Warm Cinema</button>
        <button type="button" data-grade="electric-night">Electric Night</button>
      </div>
      <label>Brightness <input id="adjust-brightness" type="range" min="-100" max="100" step="1" value="0"></label>
      <label>Contrast <input id="adjust-contrast" type="range" min="-100" max="100" step="1" value="0"></label>
      <label>Saturation <input id="adjust-saturation" type="range" min="-100" max="100" step="1" value="0"></label>
      <label>Temperature <input id="adjust-temperature" type="range" min="-100" max="100" step="1" value="0"></label>
      <label>Highlights <input id="adjust-highlights" type="range" min="-100" max="100" step="1" value="0"></label>
      <label>Grain <input id="effect-grain" type="range" min="0" max="100" step="1" value="28"></label>
      <label>Vignette <input id="effect-vignette" type="range" min="0" max="100" step="1" value="36"></label>
      <label>Bloom <input id="effect-bloom" type="range" min="0" max="100" step="1" value="18"></label>
      <label>Light leak <input id="effect-leak" type="range" min="0" max="100" step="1" value="22"></label>
      <label>Shadows <input id="adjust-shadows" type="range" min="-100" max="100" step="1" value="0"></label>
    </section>
    <section id="section-export" class="block">
      <h2>Export</h2>
      <label>File name <input id="export-name" type="text" value="vice-diaries-vice-classic-1080x1350.png"></label>
      <div class="export-actions">
        <button type="button" data-export="1080x1080">PNG 1080×1080</button>
        <button type="button" data-export="1080x1350">PNG 1080×1350</button>
        <button type="button" data-export="1920x1080">PNG 1920×1080</button>
        <button type="button" id="export-all">Export all three</button>
      </div>
      <p id="export-log">Idle.</p>
    </section>
  </aside>
</div>
<script type="module" src="./src/studio-ui.js"></script>
</body>
</html>
