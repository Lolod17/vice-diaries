<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vice Diaries</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="studio">
  <aside id="rail-left">
    <header class="brand">
      <p class="kicker">Vice City · Issue 01</p>
      <h1>Vice Diaries</h1>
    </header>
    <section class="rail-block">
      <h2>Photos</h2>
      <label class="file-btn" for="photo-input">Add photos</label>
      <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple>
      <div id="photo-strip"></div>
    </section>
    <section class="rail-block">
      <h2>Composition</h2>
      <div id="layout-list" class="stack">
        <button type="button" class="chip" data-layout="vice-classic" aria-pressed="true">Vice Classic</button>
        <button type="button" class="chip" data-layout="sunset-stories" aria-pressed="false">Sunset Stories</button>
        <button type="button" class="chip" data-layout="neon-nights" aria-pressed="false">Neon Nights</button>
        <button type="button" class="chip" data-layout="miami-lifestyle" aria-pressed="false">Miami Lifestyle</button>
        <button type="button" class="chip" data-layout="crime-drama" aria-pressed="false">Crime Drama</button>
        <button type="button" class="chip" data-layout="cinematic-split" aria-pressed="false">Cinematic Split</button>
        <button type="button" class="chip" data-layout="vertical-editorial" aria-pressed="false">Vertical Editorial</button>
        <button type="button" class="chip" data-layout="multi-collage" aria-pressed="false">Multi-Character Collage</button>
      </div>
    </section>
    <section class="rail-block">
      <h2>Frame</h2>
      <div id="size-row" class="chips">
        <button type="button" class="chip" data-size="1080x1080" aria-pressed="true">1080×1080</button>
        <button type="button" class="chip" data-size="1080x1350" aria-pressed="false">1080×1350</button>
        <button type="button" class="chip" data-size="1920x1080" aria-pressed="false">1920×1080</button>
      </div>
    </section>
  </aside>
  <div class="center">
    <div class="stage-tools">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
      <button id="compare" type="button" aria-pressed="false">Before</button>
      <span class="tool-gap"></span>
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <span id="zoom-label">Fit</span>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>
    <div id="stage">
      <canvas id="preview" width="1080" height="1080" aria-label="Cover preview"></canvas>
    </div>
    <p id="hint">1 · Drop a photo onto the stage. 2 · Pick a composition. 3 · Export a PNG.</p>
  </div>
  <aside id="rail-right">
    <section id="section-lettering" class="rail-block">
      <h2>Lettering</h2>
      <label class="field">Title <input id="title" type="text" value="VICE DIARIES" maxlength="42" autocomplete="off"></label>
      <label class="field">Subtitle <input type="text" value="Midnight on the causeway" maxlength="64" autocomplete="off"></label>
      <label class="field">Tagline <input type="text" value="COMING SOON" maxlength="32" autocomplete="off"></label>
      <div class="pair">
        <label class="field">Issue <input type="text" value="01" maxlength="8" autocomplete="off"></label>
        <label class="field">Rating <input type="text" value="R" maxlength="2" autocomplete="off"></label>
      </div>
      <label class="slider">Title scale <input type="range" min="0.7" max="1.4" step="0.01" value="1"></label>
      <label class="slider">Rotation <input type="range" min="-6" max="6" step="0.1" value="0"></label>
      <div class="chips" role="group" aria-label="Title alignment">
        <button type="button" class="chip" aria-pressed="true">Left</button>
        <button type="button" class="chip" aria-pressed="false">Centre</button>
        <button type="button" class="chip" aria-pressed="false">Right</button>
      </div>
    </section>
    <section id="section-grade" class="rail-block">
      <h2>Grade</h2>
      <div class="chips">
        <button type="button" class="chip" data-grade="vice-sunset" aria-pressed="true">Vice Sunset</button>
        <button type="button" class="chip" data-grade="miami-heat" aria-pressed="false">Miami Heat</button>
        <button type="button" class="chip" data-grade="neon-purple" aria-pressed="false">Neon Purple</button>
        <button type="button" class="chip" data-grade="tropical-gold" aria-pressed="false">Tropical Gold</button>
        <button type="button" class="chip" data-grade="midnight-vice" aria-pressed="false">Midnight Vice</button>
        <button type="button" class="chip" data-grade="retro-film" aria-pressed="false">Retro Film</button>
        <button type="button" class="chip" data-grade="warm-cinema" aria-pressed="false">Warm Cinema</button>
        <button type="button" class="chip" data-grade="electric-night" aria-pressed="false">Electric Night</button>
      </div>
      <label class="slider">Brightness <input type="range" min="-100" max="100" value="0"></label>
      <label class="slider">Contrast <input type="range" min="-100" max="100" value="0"></label>
      <label class="slider">Saturation <input type="range" min="-100" max="100" value="0"></label>
      <label class="slider">Temperature <input type="range" min="-100" max="100" value="0"></label>
      <label class="slider">Highlights <input type="range" min="-100" max="100" value="0"></label>
      <label class="slider">Shadows <input type="range" min="-100" max="100" value="0"></label>
      <label class="slider">Grain <input type="range" min="0" max="100" value="24"></label>
      <label class="slider">Vignette <input type="range" min="0" max="100" value="36"></label>
      <label class="slider">Bloom <input type="range" min="0" max="100" value="12"></label>
      <label class="slider">Light leak <input type="range" min="0" max="100" value="16"></label>
    </section>
    <section id="section-export" class="rail-block">
      <h2>Export</h2>
      <label class="field">File name <input type="text" value="vice-diaries-vice-classic-1080x1080.png" autocomplete="off" spellcheck="false"></label>
      <button id="export-png" type="button" class="action">Export PNG</button>
      <button type="button" class="action action-alt">Export all three</button>
      <ol id="export-log"></ol>
    </section>
  </aside>
</main>
<script type="module" src="./src/studio-ui.js"></script>
</body>
</html>
